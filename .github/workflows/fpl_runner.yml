import os
import threading
import requests
import pulp
from flask import Flask
from telegram import Update
from telegram.ext import ApplicationBuilder, CommandHandler, ContextTypes

# --- FPL DATA FETCHERS ---
FPL_BASE_URL = "https://fantasy.premierleague.com/api/"
HEADERS = {
    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
}

def get_fpl_bootstrap():
    url = f"{FPL_BASE_URL}bootstrap-static/"
    res = requests.get(url, headers=HEADERS)
    res.raise_for_status()
    return res.json()

def get_next_gw(data):
    for gw in data["events"]:
        if gw["is_next"]:
            return gw["id"]
    return 1

def fetch_user_squad(team_id):
    data = get_fpl_bootstrap()
    next_gw = get_next_gw(data)
    prev_gw = max(1, next_gw - 1)

    url = f"{FPL_BASE_URL}entry/{team_id}/event/{prev_gw}/picks/"
    res = requests.get(url, headers=HEADERS)
    
    if res.status_code != 200:
        return None, 0.0, next_gw

    picks_data = res.json()
    picks = [p["element"] for p in picks_data["picks"]]
    types = {t["id"]: t["singular_name_short"] for t in data["element_types"]}
    players_by_id = {p["id"]: p for p in data["elements"]}

    squad = []
    for pid in picks:
        if pid in players_by_id:
            p = players_by_id[pid]
            squad.append({
                "id": p["id"],
                "name": p["web_name"],
                "pos": types[p["element_type"]],
                "pos_id": p["element_type"],
                "ep_next": float(p["ep_next"]) if p["ep_next"] is not None else 0.0,
                "cost": p["now_cost"] / 10.0,
                "team": p["team"],
            })
    return squad, 0.0, next_gw

# --- OPTIMIZATION ENGINES ---
def solve_starting_xi(squad):
    prob = pulp.LpProblem("Lineup_Opt", pulp.LpMaximize)
    start_vars = {p["id"]: pulp.LpVariable(f"start_{p['id']}", cat="Binary") for p in squad}
    cap_vars = {p["id"]: pulp.LpVariable(f"cap_{p['id']}", cat="Binary") for p in squad}

    prob += pulp.lpSum([p["ep_next"] * start_vars[p["id"]] for p in squad]) + pulp.lpSum([p["ep_next"] * cap_vars[p["id"]] for p in squad])
    prob += (pulp.lpSum([start_vars[p["id"]] for p in squad]) == 11)
    prob += (pulp.lpSum([cap_vars[p["id"]] for p in squad]) == 1)

    for p in squad:
        prob += cap_vars[p["id"]] <= start_vars[p["id"]]

    gkps = [p for p in squad if p["pos"] == "GKP"]
    defs = [p for p in squad if p["pos"] == "DEF"]
    mids = [p for p in squad if p["pos"] == "MID"]
    fwds = [p for p in squad if p["pos"] == "FWD"]

    prob += pulp.lpSum([start_vars[p["id"]] for p in gkps]) == 1
    prob += pulp.lpSum([start_vars[p["id"]] for p in defs]) >= 3
    prob += pulp.lpSum([start_vars[p["id"]] for p in defs]) <= 5
    prob += pulp.lpSum([start_vars[p["id"]] for p in mids]) >= 2
    prob += pulp.lpSum([start_vars[p["id"]] for p in mids]) <= 5
    prob += pulp.lpSum([start_vars[p["id"]] for p in fwds]) >= 1
    prob += pulp.lpSum([start_vars[p["id"]] for p in fwds]) <= 3

    prob.solve(pulp.PULP_CBC_CMD(msg=0))

    starters, bench = [], []
    for p in squad:
        p["is_captain"] = pulp.value(cap_vars[p["id"]]) == 1
        if pulp.value(start_vars[p["id"]]) == 1:
            starters.append(p)
        else:
            bench.append(p)

    bench_gkp = [p for p in bench if p["pos"] == "GKP"]
    bench_outfield = sorted([p for p in bench if p["pos"] != "GKP"], key=lambda x: x["ep_next"], reverse=True)
    return starters, bench_gkp + bench_outfield

# --- TELEGRAM COMMANDS ---
async def start_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    await update.message.reply_text("🤖 *FPL Assistant Bot Online (Polling Mode)*\n\nUse `/setteam <ID>` and `/squad` to begin!", parse_mode="Markdown")

async def setteam_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    if not context.args:
        await update.message.reply_text("❌ Usage: `/setteam <Your_FPL_ID>`", parse_mode="Markdown")
        return
    team_id = context.args[0]
    context.user_data["team_id"] = team_id
    await update.message.reply_text(f"✅ FPL Team ID linked: *{team_id}*", parse_mode="Markdown")

async def squad_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    team_id = context.user_data.get("team_id")
    if not team_id:
        await update.message.reply_text("⚠️ Link your team first using `/setteam <ID>`.")
        return

    await update.message.reply_text("🔄 Optimizing your starting XI...")
    squad, _, next_gw = fetch_user_squad(team_id)
    if not squad:
        await update.message.reply_text("❌ Unable to fetch squad. Check your FPL Team ID.")
        return

    starters, bench = solve_starting_xi(squad)
    total_xp = sum(p["ep_next"] for p in starters) + sum(p["ep_next"] for p in starters if p.get("is_captain"))

    msg = f"📋 *GW{next_gw} Optimal Lineup* (Team: {team_id})\n📊 *Projected Score:* {total_xp:.1f} xP\n\n🟢 *STARTING XI*\n"
    for p in starters:
        role = " *(C)*" if p.get("is_captain") else ""
        msg += f"• [{p['pos']}] *{p['name']}*{role} — {p['ep_next']} xP\n"
    
    await update.message.reply_text(msg, parse_mode="Markdown")

# --- RUN BOT VIA POLLING ---
def run_telegram_bot():
    TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
    if not TOKEN:
        raise ValueError("TELEGRAM_BOT_TOKEN environment variable is not set!")
    
    app = ApplicationBuilder().token(TOKEN).build()
    app.add_handler(CommandHandler("start", start_cmd))
    app.add_handler(CommandHandler("setteam", setteam_cmd))
    app.add_handler(CommandHandler("squad", squad_cmd))
    
    print("🤖 Bot is up and running via Long Polling...")
    app.run_polling()

# --- FLASK HEALTH-CHECK SERVER FOR RENDER ---
flask_app = Flask(__name__)

@flask_app.route("/")
def health_check():
    return "FPL Bot is alive and polling!", 200

if __name__ == "__main__":
    # Start Telegram bot in a separate background thread
    bot_thread = threading.Thread(target=run_telegram_bot, daemon=True)
    bot_thread.start()

    # Run Flask on the main thread so Render's health check is satisfied
    port = int(os.environ.get("PORT", 5000))
    flask_app.run(host="0.0.0.0", port=port)
