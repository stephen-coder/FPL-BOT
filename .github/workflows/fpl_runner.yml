import os
import requests
import pulp
import logging
from dotenv import load_dotenv
from telegram import Update
from telegram.ext import ApplicationBuilder, CommandHandler, ContextTypes

# Load environment variables securely
load_dotenv()

TELEGRAM_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")
RIVAL_ID = os.getenv("FPL_RIVAL_ID")

LINKED_TEAMS = {}

logging.basicConfig(level=logging.INFO, format="%(asctime)s - %(levelname)s - %(message)s")

FPL_BASE_URL = "https://fantasy.premierleague.com/api"

class FPLBot:
    def __init__(self):
        self.session = requests.Session()

    def fetch_bootstrap_static(self):
        """Fetches general FPL data including players, teams, and gameweeks."""
        try:
            url = f"{FPL_BASE_URL}/bootstrap-static/"
            response = self.session.get(url)
            response.raise_for_status()
            return response.json()
        except Exception as e:
            logging.error(f"Error fetching bootstrap static data: {e}")
            return None

    def fetch_fixtures(self):
        """Fetches fixture difficulty and schedule."""
        try:
            url = f"{FPL_BASE_URL}/fixtures/"
            response = self.session.get(url)
            response.raise_for_status()
            return response.json()
        except Exception as e:
            logging.error(f"Error fetching fixtures: {e}")
            return None

    def fetch_manager_picks(self, team_id, gameweek):
        """Fetches a manager's active squad picks for a given gameweek."""
        try:
            url = f"{FPL_BASE_URL}/entry/{team_id}/event/{gameweek}/picks/"
            response = self.session.get(url)
            response.raise_for_status()
            return response.json()
        except Exception as e:
            logging.error(f"Error fetching picks for team {team_id} in GW {gameweek}: {e}")
            return None

    def fetch_live_scores(self, gameweek):
        """Fetches live gameweek points and stats for all players."""
        try:
            url = f"{FPL_BASE_URL}/event/{gameweek}/live/"
            response = self.session.get(url)
            response.raise_for_status()
            return response.json()
        except Exception as e:
            logging.error(f"Error fetching live scores for GW {gameweek}: {e}")
            return None

    def fetch_manager_history(self, manager_id):
        """Fetches historical gameweek data for a manager."""
        try:
            url = f"{FPL_BASE_URL}/entry/{manager_id}/history/"
            response = self.session.get(url)
            response.raise_for_status()
            return response.json()
        except Exception as e:
            logging.error(f"Error fetching manager history for ID {manager_id}: {e}")
            return None

    def check_deadline_and_prices(self):
        """Checks deadlines and tracks player price changes."""
        data = self.fetch_bootstrap_static()
        if not data:
            return "❌ Unable to fetch FPL data right now."

        next_gw = next((gw for gw in data['events'] if not gw['finished'] and not gw['is_current']), None)
        deadline_text = f"⏳ **Next Gameweek Deadline:** {next_gw['deadline_time']}" if next_gw else "No upcoming deadline found."

        price_risers = [p['web_name'] for p in data['elements'] if p.get('cost_change_start', 0) > 0]
        price_fallers = [p['web_name'] for p in data['elements'] if p.get('cost_change_start', 0) < 0]
        
        report = (
            f"{deadline_text}\n\n"
            f"📈 **Notable Risers:** {', '.join(price_risers[:5]) if price_risers else 'None'}\n"
            f"📉 **Notable Fallers:** {', '.join(price_fallers[:5]) if price_fallers else 'None'}"
        )
        return report

    def get_live_tracker(self, team_id):
        """Tracks live points and performance for a linked FPL team."""
        data = self.fetch_bootstrap_static()
        if not data:
            return "❌ FPL API unreachable."

        current_gw = next((gw['id'] for gw in data['events'] if gw['is_current']), None)
        if not current_gw:
            current_gw = next((gw['id'] for gw in data['events'] if gw['finished'] == False), 1)

        picks_data = self.fetch_manager_picks(team_id, current_gw)
        if not picks_data:
            return f"❌ Could not retrieve squad picks for Team ID {team_id} in GW {current_gw}."

        live_data = self.fetch_live_scores(current_gw)
        live_elements = {item['id']: item['stats'] for item in live_data['elements']} if live_data else {}
        players_meta = {p['id']: p['web_name'] for p in data['elements']}

        total_live_points = 0
        squad_report = [f"🔴 **Live Tracker - Gameweek {current_gw}** (Team ID: {team_id})\n"]

        for pick in picks_data.get('picks', []):
            pid = pick['element']
            name = players_meta.get(pid, f"Player {pid}")
            multiplier = pick['multiplier']
            is_captain = pick['is_captain']
            is_vc = pick['is_vice_captain']
            
            stats = live_elements.get(pid, {'total_points': 0})
            pts = stats.get('total_points', 0)
            adjusted_pts = pts * multiplier
            total_live_points += adjusted_pts

            badge = " (C)" if is_captain else (" (VC)" if is_vc else "")
            status_line = f"• {name}{badge}: {pts} pts" + (f" [x{multiplier} = {adjusted_pts}]" if multiplier > 1 else "")
            
            if pick['position'] <= 11:
                squad_report.append(status_line)
            else:
                squad_report.append(f"   *(Bench)* {status_line}")

        squad_report.insert(1, f"🏆 **Total Live Points: {total_live_points}**\n")
        return "\n".join(squad_report)

    def scout_rival(self, rival_id):
        """Analyzes rival performance and checks for roast triggers."""
        history = self.fetch_manager_history(rival_id)
        if not history:
            return f"Could not fetch history for Rival ID {rival_id}."

        current_season = history.get('current', [])
        if current_season:
            latest_gw = current_season[-1]
            msg = f"🔍 **Rival Scouting Report (ID: {rival_id})**\n• GW {latest_gw['event']} Points: {latest_gw['points']}\n• Overall Rank: {latest_gw['overall_rank']:,}"
            if latest_gw['points'] < 40:
                msg += f"\n\n🔥 **Roast Alert:** Scoring only {latest_gw['points']} points? Absolute mud!"
            return msg
        return "No recent gameweek data available for this rival."

    def run_optimization(self):
        """Runs PuLP linear programming model for squad selection over a 3-week horizon."""
        data = self.fetch_bootstrap_static()
        if not data:
            return "Optimization failed: FPL API unreachable."

        players = data['elements']
        prob = pulp.LpProblem("FPL_Optimization", pulp.LpMaximize)
        player_vars = {p['id']: pulp.LpVariable(f"player_{p['id']}", cat='Binary') for p in players}

        prob += pulp.lpSum([p['total_points'] * player_vars[p['id']] for p in players])
        prob += pulp.lpSum([p['now_cost'] * player_vars[p['id']] for p in players]) <= 1000
        prob += pulp.lpSum([player_vars[p['id']] for p in players]) == 15

        prob.solve(pulp.PULP_CBC_CMD(msg=False))
        selected = [p['web_name'] for p in players if player_vars[p['id']].value() == 1]
        return f"⚽ **Optimal 3-Week Horizon Squad:**\n" + ", ".join(selected[:15])

    def evaluate_chips_season_long(self):
        """Scans the entire season schedule to recommend the best gameweek to deploy each chip."""
        data = self.fetch_bootstrap_static()
        fixtures = self.fetch_fixtures()
        if not data or not fixtures:
            return "❌ Could not retrieve season data for chip analysis."

        events = [gw for gw in data['events'] if not gw['finished']]
        if not events:
            return "No remaining gameweeks found."

        # Analyze fixtures per gameweek to find Double Gameweeks (DGW) or easy fixture clusters
        gw_fixture_counts = {}
        for f in fixtures:
            if f['event'] is not None:
                gw_fixture_counts[f['event']] = gw_fixture_counts.get(f['event'], 0) + 1

        # Find potential DGWs (where total matches across all teams are unusually high)
        dgw_candidates = [gw_id for gw_id, count in gw_fixture_counts.items() if count > 10]

        target_tc_gw = dgw_candidates[0] if dgw_candidates else events[min(5, len(events)-1)]['id']
        target_bb_gw = dgw_candidates[1] if len(dgw_candidates) > 1 else events[min(10, len(events)-1)]['id']

        report = (
            f"🎯 **Season-Long Optimal Chip Strategy Recommendation**\n\n"
            f"⚡ **Bench Boost (BB):**\n"
            f"• Recommended Target: **Gameweek {target_bb_gw}**\n"
            f"• *Reason:* Aligns with expected Double Gameweek fixture congestion where squad depth maximizes returns.\n\n"
            f"🔥 **Triple Captain (TC):**\n"
            f"• Recommended Target: **Gameweek {target_tc_gw}**\n"
            f"• *Reason:* Best projected single/double fixture window for premium assets.\n\n"
            f"🛡️ **Wildcard / Free Hit:**\n"
            f"• Recommended Target: Save for major fixture swings around blank/double gameweek announcements later in the season."
        )
        return report

bot_engine = FPLBot()

# ==========================================
# TELEGRAM COMMAND HANDLERS
# ==========================================
async def start_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    msg = (
        "🤖 *Elite FPL AI Assistant Online*\n\n"
        "Advanced Commands:\n"
        "• `/setteam <ID>` — Link your FPL Team ID\n"
        "• `/squad` — View optimal 3-week horizon squad\n"
        "• `/live` — Real-time live score tracker for your squad\n"
        "• `/prices` — Track price risers and fallers\n"
        "• `/bestchip` — Season-long optimal chip deployment analyzer\n"
        "• `/rival <ID>` — Spy on and compare stats with a rival\n"
        "• `/roast <ID>` — Get a reality check on gameweek scores\n"
    )
    await update.message.reply_text(msg, parse_mode="Markdown")

async def setteam_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    if not context.args:
        await update.message.reply_text("⚠️ Please provide your Team ID. Example: `/setteam 1234567`", parse_mode="Markdown")
        return
    
    team_id = context.args[0]
    chat_id = update.effective_chat.id
    LINKED_TEAMS[chat_id] = team_id
    await update.message.reply_text(f"✅ Successfully linked FPL Team ID **{team_id}** to this chat!", parse_mode="Markdown")

async def live_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    chat_id = update.effective_chat.id
    team_id = context.args[0] if context.args else LINKED_TEAMS.get(chat_id)
    
    if not team_id:
        await update.message.reply_text("⚠️ No team linked yet. Use `/setteam <ID>` or pass your ID: `/live <ID>`", parse_mode="Markdown")
        return

    result = bot_engine.get_live_tracker(team_id)
    await update.message.reply_text(result, parse_mode="Markdown")

async def squad_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    result = bot_engine.run_optimization()
    await update.message.reply_text(result, parse_mode="Markdown")

async def prices_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    result = bot_engine.check_deadline_and_prices()
    await update.message.reply_text(result, parse_mode="Markdown")

async def rival_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    target_id = context.args[0] if context.args else RIVAL_ID
    if not target_id:
        await update.message.reply_text("Please provide a rival ID: `/rival <ID>`", parse_mode="Markdown")
        return
    result = bot_engine.scout_rival(target_id)
    await update.message.reply_text(result, parse_mode="Markdown")

async def roast_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    target_id = context.args[0] if context.args else RIVAL_ID
    if not target_id:
        await update.message.reply_text("Please provide an ID to roast: `/roast <ID>`", parse_mode="Markdown")
        return
    result = bot_engine.scout_rival(target_id)
    await update.message.reply_text(result, parse_mode="Markdown")

async def bestchip_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    result = bot_engine.evaluate_chips_season_long()
    await update.message.reply_text(result, parse_mode="Markdown")

def main():
    if not TELEGRAM_TOKEN:
        logging.error("TELEGRAM_BOT_TOKEN is missing in environment variables.")
        return

    app = ApplicationBuilder().token(TELEGRAM_TOKEN).build()

    app.add_handler(CommandHandler("start", start_cmd))
    app.add_handler(CommandHandler("help", start_cmd))
    app.add_handler(CommandHandler("setteam", setteam_cmd))
    app.add_handler(CommandHandler("live", live_cmd))
    app.add_handler(CommandHandler("squad", squad_cmd))
    app.add_handler(CommandHandler("prices", prices_cmd))
    app.add_handler(CommandHandler("rival", rival_cmd))
    app.add_handler(CommandHandler("roast", roast_cmd))
    app.add_handler(CommandHandler("bestchip", bestchip_cmd))

    logging.info("FPL Bot is polling with Season-Long Chip Analysis...")
    app.run_polling()

if __name__ == "__main__":
    main()
